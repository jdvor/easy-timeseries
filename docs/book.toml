[book]
title = "Easy TimeSeries"
description = "Columnar time-series storage for .NET: compact on-disk format, per-column compression, and a source generator for DTOs."
language = "en"
src = "."

[build]
build-dir = "../site"

# https://github.com/badboy/mdbook-mermaid
[preprocessor.mermaid]
command = "mdbook-mermaid"

# https://github.com/badboy/mdbook-toc
[preprocessor.toc]
command = "mdbook-toc"
max-level = 3
renderer = ["html"]

[output.html]
additional-js = ["./assets/vendor/mermaid.min.js", "./assets/vendor/mermaid-init.js"]

[output.html.print]
enable = false

[output.html.fold]
enable = true
