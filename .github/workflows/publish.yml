name: 'Publish'

permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: skip unit tests
        required: false
        type: boolean

jobs:
  build:
    name: 'Build & Publish'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 0 => all history for all branches and tags
          submodules: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: /home/runner/.nuget/packages
          key: packages-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: packages-${{ runner.os }}-

      - name: Execute tests
        if: ${{ !inputs.skip_tests }}
        run: DOTNET_NOLOGO=1 dotnet test -c Release -v minimal

      - name: Validate NuGet packages
        run: ./scripts/validate-nuget-packages.sh

      - name: Determine semantic version
        id: semver
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: ""
          # Breaking change if the body contains "BREAKING CHANGE", or a conventional-commit header uses "!" before the colon (e.g. "feat!:", "fix(api)!:").
          major_pattern: "/(BREAKING CHANGE|(^|\\n)[a-z]+(\\([^)]+\\))?!:)/"
          # Minor bump on a feature commit, with or without a scope (e.g. "feat:", "feat(api):").
          minor_pattern: "/(^|\\n)feat(\\([^)]+\\))?:/"
          search_commit_body: true
          version_format: "${major}.${minor}.${patch}"

      - name: Create version tag
        id: version
        run: ./scripts/version.sh -v ${{ steps.semver.outputs.version }} -i ${{ steps.semver.outputs.increment }} --create-tag >> $GITHUB_OUTPUT

      - name: Pack and push to nuget.org
        run: ./scripts/pack.sh -v "${{ steps.version.outputs.version_prefix }}" -s "${{ steps.version.outputs.version_suffix }}" -p "${{ secrets.ETS_API_KEY }}"