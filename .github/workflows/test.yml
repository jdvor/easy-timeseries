name: 'Test'

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', '**.sh', '.editorconfig', '.gitignore', '.gitattributes']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-22.04
    # The pull_request run tests refs/pull/N/merge. With strict required status checks and
    # merge-commit-only merges that is the same tree that lands on master, so skip the re-test.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: /home/runner/.nuget/packages
          key: packages-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: packages-${{ runner.os }}-

      - name: Check vulnerabilities
        run: ./scripts/check-vulnerabilities.sh

      - name: Execute tests
        env:
          DOTNET_NOLOGO: 1
        run: |
          dotnet test -c Release -v minimal \
            --results-directory ./artifacts/trx \
            --report-trx \
            --coverage --coverage-output-format cobertura \
            --coverage-settings ./tests/code-coverage.settings.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: (!cancelled())
        with:
          files: ./artifacts/trx/**/*.trx

      - name: Merge coverage reports
        if: (!cancelled())
        run: |
          dotnet tool restore
          dotnet dotnet-coverage merge --nologo -o ./artifacts/coverage.cobertura.xml -f cobertura ./artifacts/trx/*.cobertura.xml

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: (!cancelled())
        with:
          filename: ./artifacts/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Add coverage to job summary
        if: (!cancelled())
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
  # Companion to the `if:` on `test` above - the two conditions are exact inverses and must be
  # kept in sync. Its only purpose is to make the skipped `Test` job self-explanatory in the UI.
  explain-skip:
    name: 'Test skipped (already run on the PR)'
    runs-on: ubuntu-22.04
    permissions: {}
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request') }}

    steps:
      - name: Explain why Test was skipped
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pr=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | head -1 | sed -n 's/^Merge pull request #\([0-9]\{1,\}\).*/\1/p')
          if [ -n "$pr" ]; then ref="pull request #$pr"; else ref="the pull request"; fi

          echo "::notice title=Test skipped by design::Tests for this merge commit already ran on ${ref}. This is not a failure."

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Test skipped by design

          The \`Test\` job is greyed out on this run **on purpose** - it is not an error and nothing went wrong.

          This commit is the merge of ${ref}. Branch protection on \`master\` requires a passing \`Test\` check and
          an up-to-date branch, and merges use a merge commit. That means the \`pull_request\` run tested
          \`refs/pull/N/merge\` - the exact tree this merge commit has. Re-running it here would test nothing new.

          Direct pushes to \`master\` (admin bypass) are **not** skipped and still run the full suite.
          EOF
