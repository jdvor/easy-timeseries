name: 'Test'

permissions:
  actions: read
  contents: write
  checks: write
  pull-requests: write

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', '**.sh', '.editorconfig', '.gitignore', '.gitattributes']
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-22.04
    # The pull_request run tests refs/pull/N/merge. With strict required status checks and
    # merge-commit-only merges that is the same tree that lands on master, so skip the re-test.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: /home/runner/.nuget/packages
          key: packages-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: packages-${{ runner.os }}-

      - name: Check vulnerabilities
        run: ./scripts/check-vulnerabilities.sh

      - name: Execute tests
        env:
          DOTNET_NOLOGO: 1
        run: |
          dotnet test -c Release -v minimal \
            --results-directory ./artifacts/trx \
            --report-trx \
            --coverage --coverage-output-format cobertura

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: (!cancelled())
        with:
          files: ./artifacts/trx/**/*.trx

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: (!cancelled())
        with:
          filename: ./artifacts/trx/*.cobertura.xml
          badge: true
          format: markdown
          output: both

      - name: Add coverage to job summary
        if: (!cancelled())
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY